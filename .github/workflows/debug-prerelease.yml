name: Debug Prerelease

on:
  push:
    branches:
      - feat/p3-spatial
    paths:
      - "apps/android-agent/**"
      - "apps/quest-unity-client/**"
      - ".github/workflows/debug-prerelease.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Run Android unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build Android debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare Android APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release/android"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Android APK not found"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/release/android/QuestPhoneStream-Android-debug.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: release/android/*.apk
          if-no-files-found: error
          retention-days: 7

  quest:
    name: Build Quest Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Set UNITY_EMAIL and UNITY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in GitHub Actions secrets."
            exit 1
          fi

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: apps/quest-unity-client
          unityVersion: 2022.3.62f3
          testMode: all
          artifactsPath: unity-test-results

      - name: Build Quest Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: apps/quest-unity-client
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: QuestPhoneStream
          buildsPath: build
          allowDirtyBuild: true

      - name: Prepare Quest APK
        shell: bash
        run: |
          mkdir -p release/quest
          APK="$(find build -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Quest APK not found"
            exit 1
          fi
          cp "$APK" release/quest/QuestPhoneStream-Quest-debug.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-debug-apk
          path: release/quest/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Debug Prerelease
    needs:
      - android
      - quest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-debug-apk"
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test -f release-assets/QuestPhoneStream-Android-debug.apk
          test -f release-assets/QuestPhoneStream-Quest-debug.apk
          ls -lh release-assets/*.apk

      - name: Create or update GitHub Prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="debug-${SHORT_SHA}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.apk --clobber
          else
            gh release create "$TAG" \
              release-assets/*.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Debug ${SHORT_SHA}" \
              --notes "Automated debug build from commit ${GITHUB_SHA}."
          fi
