name: Build Quest APK

on:
  push:
    branches:
      - main
    paths:
      - "apps/quest-unity-client/**"
      - ".github/workflows/build-quest-apk.yml"
  pull_request:
    paths:
      - "apps/quest-unity-client/**"
      - ".github/workflows/build-quest-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-quest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-quest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Set UNITY_EMAIL and UNITY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in GitHub Actions secrets."
            exit 1
          fi

      - name: Normalize Unity version for GameCI
        shell: bash
        run: |
          # The repository is authored with Unity China 2022.3.62f3c1.
          # GameCI does not publish China-special-edition editor images, so CI
          # uses the matching upstream 2022.3.62f3 editor in the ephemeral checkout.
          printf '%s\n' \
            'm_EditorVersion: 2022.3.62f3' \
            'm_EditorVersionWithRevision: 2022.3.62f3 (96770f904ca7)' \
            > apps/quest-unity-client/ProjectSettings/ProjectVersion.txt

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: apps/quest-unity-client
          unityVersion: 2022.3.62f3
          testMode: all
          artifactsPath: unity-test-results

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-unity-test-results
          path: unity-test-results
          if-no-files-found: warn

  build-quest-apk:
    needs: test-quest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Set UNITY_EMAIL and UNITY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in GitHub Actions secrets."
            exit 1
          fi

      - name: Normalize Unity version for GameCI
        shell: bash
        run: |
          printf '%s\n' \
            'm_EditorVersion: 2022.3.62f3' \
            'm_EditorVersionWithRevision: 2022.3.62f3 (96770f904ca7)' \
            > apps/quest-unity-client/ProjectSettings/ProjectVersion.txt

      - name: Build Quest Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: apps/quest-unity-client
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: QuestPhoneStream
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload Quest APK
        uses: actions/upload-artifact@v6
        with:
          name: quest-apk
          path: build/**/*.apk
          if-no-files-found: error
