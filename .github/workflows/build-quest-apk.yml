name: Build Quest APK

on:
  push:
    branches:
      - main
      - fix/settings-session-gates
    paths:
      - "apps/quest-unity-client/**"
      - ".github/workflows/build-quest-apk.yml"
  pull_request:
    paths:
      - "apps/quest-unity-client/**"
      - ".github/workflows/build-quest-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-quest-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Set UNITY_EMAIL and UNITY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in GitHub Actions secrets."
            exit 1
          fi
      - name: Build Quest Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: apps/quest-unity-client
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: QuestPhoneStream
          buildsPath: build
          allowDirtyBuild: true
      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-apk
          path: build/**/*.apk
          if-no-files-found: error
